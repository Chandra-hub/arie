name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arie
          POSTGRES_PASSWORD: arie
          POSTGRES_DB: arie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        env:
          NODE_ENV: test
          ANTHROPIC_API_KEY: test-key
          STORAGE_ADAPTER: postgres
          DATABASE_URL: postgresql://arie:arie@localhost:5432/arie_test
          API_KEY_SALT: test-salt-for-ci-minimum-16-chars
        run: npm run test:run

      - name: Build
        run: npm run build

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arie-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arie-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_ARIE_API_URL: http://localhost:3000/api/v1
        run: npm run build
